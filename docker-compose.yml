services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teatally
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: teatally
    volumes:
      - teatally_db_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://teatally:${DB_PASSWORD}@db:5432/teatally
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
    volumes:
      - teatally_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.teatally.rule=Host(`teatally.srv1850692.hstgr.cloud`)"
      - "traefik.http.routers.teatally.entrypoints=websecure"
      - "traefik.http.routers.teatally.tls.certresolver=letsencrypt"
      - "traefik.http.services.teatally.loadbalancer.server.port=8000"

networks:
  internal:
  traefik-proxy:
    external: true

volumes:
  teatally_db_data:
  teatally_uploads:
